[package]
name = "tpm2-tpmkey"
description = "TPM 2.0 key ASN.1 file reader and writer"
version = "0.12.1"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.com/tpm-protocol/tpm2-protocol"
repository = "https://gitlab.com/tpm-protocol/tpm2-protocol"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"

[dependencies]
hex = "0.4"
pem = "3.0"
rasn = "0.26"
strum = { version = "0.28", features = ["derive"] }
tpm2-protocol = "0.20.2"

[dev-dependencies]
rstest = "0.21"
