[package]
name = "tpm2sh"
description = "TPM 2.0 command-line interface"
version = "0.15.23"
license = "GPL-3.0-or-later"
homepage = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2sh.git/about/?h=main"
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2sh.git"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2021"
rust-version = "1.81"
readme = "README.md"

[[bin]]
name = "tpm2sh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive"] }
ctrlc = "3.4"
directories = "5.0"
hex = "0.4"
indicatif = { version = "0.17", default-features = false }
log = "0.4"
nix = { version = "0.29", features = ["fs", "poll"] }
openssl = "0.10"
pem = "3.0"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
tabled = { version = "0.15", default-features = false, features = ["std", "derive", "ansi"] }
thiserror = "1.0"
tpm2-crypto = "0.8.0"
tpm2-device = "0.3.1"
tpm2-policy-language = "0.9.6"
tpm2-protocol = "0.15.9"
tpm2-tpmkey = "0.9.1"
tpm2-vtpm = "0.3.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "tracing-log"] }

[dev-dependencies]
assert_cmd = "2.0"
duct = "0.13"
predicates = "3.0"
rstest = "0.23"
tempfile = "3.10"

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = true
