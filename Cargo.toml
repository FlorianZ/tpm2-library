[package]
name = "tpm2sh"
description = "TPM 2.0 shell"
version = "0.13.1"
license = "GPL-3.0-or-later"
homepage = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2sh.git/about/?h=main"
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2sh.git"
authors = ["Jarkko Sakkinen <jarkko.sakkinen@opinsys.com>"]
edition = "2021"
rust-version = "1.79"
readme = "README.md"

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "tpm2sh"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cfb-mode = "0.8"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
directories = "5.0"
elliptic-curve = { version = "0.13", features = ["ecdh"] }
env_logger = "0.11"
generic-array = "0.14"
hex = "0.4"
hmac = "0.12"
log = "0.4"
nix = { version = "0.29", features = ["fs"] }
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
p521 = { version = "0.13", features = ["ecdh"] }
pem = "3.0"
polling = "3.7"
rand = "0.8"
rasn = "0.26"
rasn-derive = "0.26"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
tpm2-crypto = "0.1"
tpm2-protocol = "0.11"
