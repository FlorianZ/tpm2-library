[package]
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
description = "TPM 2.0 policy language parser"
edition = "2021"
homepage = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2-crypto.git/about/?h=main"
license = "MIT OR Apache-2.0"
name = "tpm2-policy-language"
readme = "README.md"
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2-crypto.git"
rust-version = "1.79"
version = "0.2.0"

[dependencies]
hex = "0.4"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
tpm2-protocol = "0.11"
