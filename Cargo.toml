[package]
name = "tpm2-device"
description = "TPM 2.0 device interface"
version = "0.5.7"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.com/tpm-protocol/tpm2-device"
repository = "https://gitlab.com/tpm-protocol/tpm2-device"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2021"
rust-version = "1.81"
readme = "README.md"

[dependencies]
hex = "0.4"
log = "0.4"
nix = { version = "0.29", features = ["fs", "poll"] }
rand = "0.8"
thiserror = "1.0"
tpm2-crypto = "0.11.1"
tpm2-protocol = "0.16.4"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
rstest = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
