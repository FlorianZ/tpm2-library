[package]
name = "tpm2-device"
description = "TPM 2.0 device interface"
version = "0.1.3"
license = "MIT OR Apache-2.0"
homepage = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2-device.git/about/?h=main"
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/jarkko/tpm2-device.git"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2021"
rust-version = "1.81"
readme = "README.md"

[dependencies]
hex = "0.4"
log = "0.4"
nix = { version = "0.29", features = ["fs", "poll"] }
thiserror = "1.0"
tpm2-crypto = "0.7.1"
tpm2-policy-language = "0.8.1"
tpm2-protocol = "0.15.4"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
rstest = "0.21"
