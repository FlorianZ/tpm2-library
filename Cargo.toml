[package]
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
description = "TPM 2.0 policy language interpreter"
edition = "2024"
homepage = "https://gitlab.com/tpm-protocol/tpm2-policy-language"
license = "MIT OR Apache-2.0"
name = "tpm2-policy-language"
readme = "README.md"
repository = "https://gitlab.com/tpm-protocol/tpm2-policy-language"
rust-version = "1.85"
version = "0.10.10"

[dependencies]
hex = "0.4"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
tpm2-crypto = "0.11.1"
tpm2-protocol = "0.16.4"

[dev-dependencies]
rstest = "0.21"
