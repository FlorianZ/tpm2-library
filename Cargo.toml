[package]
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
description = "TPM 2.0 cryptographic routines"
edition = "2024"
homepage = "https://gitlab.com/tpm-protocol/tpm2-crypto"
license = "MIT OR Apache-2.0"
name = "tpm2-crypto"
readme = "README.md"
repository = "https://gitlab.com/tpm-protocol/tpm2-crypto"
rust-version = "1.85"
version = "0.20.1"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
openssl = { version = "0.10" }
rand = "0.10"
strum = { version = "0.28", features = ["derive"] }
tpm2-protocol = "0.20.0"

[[test]]
name = "hmac"
path = "tests/hmac.rs"
harness = true

[[test]]
name = "public"
path = "tests/public.rs"
harness = true

[dev-dependencies]
hex = "0.4"
rstest = "0.26"
