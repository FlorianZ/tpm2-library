[package]
name = "tpm2-tpmkey"
description = "TPM 2.0 key ASN.1 file reader and writer"
version = "0.11.8"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.com/tpm-protocol/tpm2-protocol"
repository = "https://gitlab.com/tpm-protocol/tpm2-protocol"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2021"
rust-version = "1.81"
readme = "README.md"

[dependencies]
hex = "0.4"
pem = "3.0"
rasn = "0.26"
thiserror = "1.0"
tpm2-protocol = "0.16.7"

[dev-dependencies]
rstest = "0.21"
