[package]
name = "tpm2-vtpm"
description = "TPM 2.0 virtual TPM context cache"
version = "0.6.3"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.com/tpm-protocol/tpm2-vtpm"
repository = "https://gitlab.com/tpm-protocol/tpm2-vtpm"
authors = ["Jarkko Sakkinen <jarkko@kernel.org>"]
edition = "2021"
rust-version = "1.81"
readme = "README.md"

[dependencies]
log = "0.4"
thiserror = "1.0"
tpm2-crypto = "0.11.3"
tpm2-protocol = "0.16.7"

[dev-dependencies]
rstest = "0.18"
tempfile = "3.10"
